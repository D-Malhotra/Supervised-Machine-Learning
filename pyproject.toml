[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supervised-learning"
version = "0.1.0"
description = "Supervised learning methods implemented from scratch on numpy"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
]

[tool.setuptools]
packages = ["src"]
